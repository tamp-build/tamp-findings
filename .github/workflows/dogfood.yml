name: Dogfood scan + ingest

# tamp.findings scans itself and files its own findings through the tamp
# wrappers. Deliberately NOT part of ci.yml: this needs credentials and network
# egress to a live instance, so it must never be the thing that blocks a merge.
#
# Requires two repository secrets. Without them the job exits cleanly with a
# notice rather than failing:
#   TAMP_FINDINGS_URL            e.g. https://tamp-findings.example.com
#   TAMP_FINDINGS_INGEST_TOKEN   a cli_/prj_ token minted in the app
#
# ONE job, in order, because the dynamic scans need something the static ones
# do not: a running instance. ScanAll goes first (its Roslyn leg rebuilds with
# NoIncremental and wants nothing holding the DLLs), then the image is built
# and started against a Postgres service, then ZAP / Nuclei / axe-core scan it.
#
# Every scan step is continue-on-error. A scanner that fails to install or
# errors out must not read as a code failure — and it must not read as a clean
# scan either, which is what the scan-run receipts are for: a scanner with no
# receipt shows as "never ran" on the dashboard rather than as green.

on:
  push:
    branches: [main]
  schedule:
    # 07:00 UTC daily. A missing scan is not a clean scan, so the receipt
    # should refresh even on days nothing merges.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: dogfood
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan and ingest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The app under dynamic scan needs a database. Reachable on localhost
    # because the app container below runs with --network host.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tamp_findings
          POSTGRES_USER: tamp
          POSTGRES_PASSWORD: tamp
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Scanners and the ingest context read git history for the commit
          # sha, branch and computed version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check credentials
        id: creds
        env:
          URL: ${{ secrets.TAMP_FINDINGS_URL }}
          TOKEN: ${{ secrets.TAMP_FINDINGS_INGEST_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::TAMP_FINDINGS_URL / TAMP_FINDINGS_INGEST_TOKEN not configured — skipping dogfood ingest."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache NuGet packages
        if: steps.creds.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The Tamp wrappers resolve these from PATH and the targets .Requires()
      # them, so a missing binary fails its leg rather than skipping it quietly.
      #
      # Each installer is separately best-effort: one upstream install script
      # having a bad day should cost that scanner's leg, not the whole run. The
      # version dump at the end is the record of what actually made it.
      - name: Install scanners
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          B=/usr/local/bin

          # Supply-chain hardening (TFND-227; Sonar S8482 + S6506). Nothing downloaded is piped into a shell
          # or run unchecked: everything is fetched over HTTPS only, then VERIFIED before it runs.
          #  - Installer scripts are pinned to an upstream COMMIT and a SHA-256, so a changed or tampered
          #    script fails the check instead of executing. To bump one: fetch the script at the new commit,
          #    review it, and update both values here.
          #  - Release binaries are checked against the checksums file the project publishes.
          # Each install stays best-effort on its own: one failing or non-verifying download costs that
          # scanner's leg (and says so), not the whole run.
          fetch() { curl --proto '=https' --tlsv1.2 -sSfL "$1" -o "$2"; }

          # run_pinned_installer <name> <repo> <commit> <path-in-repo> <sha256> <shell> [installer args...]
          run_pinned_installer() {
            local name=$1 repo=$2 commit=$3 path=$4 sha=$5 shell=$6; shift 6
            local f="/tmp/install-$name.sh"
            fetch "https://raw.githubusercontent.com/$repo/$commit/$path" "$f" \
              && echo "$sha  $f" | sha256sum -c --quiet - \
              && "$shell" "$f" "$@" \
              || echo "::warning::$name install failed or did not verify"
          }

          run_pinned_installer syft       anchore/syft                 cc326e45a6213360266dda4b30cc68095946d676 install.sh         787fe2aa12311f7dd8e1d9337dfc6e25f091396c958937293a2d3c0eca2ff8ce sh -b $B
          run_pinned_installer grype      anchore/grype                2dca57778b4fda20c9b769f964aa71f76dbadb27 install.sh         4bc8e844d1ca0b74082cb51e1587d58c35150756954660db3d3078e57c81cbfd sh -b $B
          run_pinned_installer trivy      aquasecurity/trivy           75c4dc0f45c5d7ffd05ae26df1e0c666787bdf2a contrib/install.sh e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a sh -b $B
          run_pinned_installer trufflehog trufflesecurity/trufflehog   f37f2eff68c31620fd88bc37ff2b7d57ea0c700c scripts/install.sh c394defeaea8a7c48f828a2051b608a9b19f43f34b891407b66a386c3e2591e2 sh -b $B

          # OpenGrep — the primary SAST leg. Without it the sast gate has
          # nothing behind it.
          run_pinned_installer opengrep   opengrep/opengrep            a08950f1afd943aab8bba0b4398384c13455502b install.sh         169ed90fb8a5116d01bc0e51ee810dbd67188cda44c6f6c743ffe42ae04059b8 bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

          # OSV-Scanner — cross-ecosystem CVE rows that Grype's SBOM pass can
          # miss (TFND-16 reconciles the two). Verified against the release's published SHA256SUMS.
          OSV=https://github.com/google/osv-scanner/releases/latest/download
          if fetch "$OSV/osv-scanner_linux_amd64" /tmp/osv-scanner_linux_amd64 \
             && fetch "$OSV/osv-scanner_SHA256SUMS" /tmp/osv-scanner.sums \
             && grep ' osv-scanner_linux_amd64$' /tmp/osv-scanner.sums | (cd /tmp && sha256sum -c --quiet -); then
            install -m 0755 /tmp/osv-scanner_linux_amd64 $B/osv-scanner
          else
            echo "::warning::osv-scanner install failed or did not verify"
          fi

          # Nuclei — template-driven DAST against the container started below.
          # The asset filename carries the version, so
          # `releases/latest/download/<fixed-name>` 404s the moment upstream
          # ships a release — it was pinned to 3.3.7 while latest was 3.11.1.
          # Resolve the real asset from the API instead, then verify it against that release's checksums file.
          NUCLEI_URL=$(curl --proto '=https' --tlsv1.2 -sSfL https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
            | grep -oE 'https://[^"]+nuclei_[0-9.]+_linux_amd64\.zip' | head -1)
          if [ -n "${NUCLEI_URL:-}" ]; then
            NUCLEI_ZIP=$(basename "$NUCLEI_URL")
            NUCLEI_SUMS="${NUCLEI_ZIP%_linux_amd64.zip}_checksums.txt"
            if fetch "$NUCLEI_URL" "/tmp/$NUCLEI_ZIP" \
               && fetch "${NUCLEI_URL%/*}/$NUCLEI_SUMS" /tmp/nuclei.sums \
               && grep " $NUCLEI_ZIP\$" /tmp/nuclei.sums | (cd /tmp && sha256sum -c --quiet -); then
              unzip -oq "/tmp/$NUCLEI_ZIP" -d $B && chmod +x $B/nuclei
            else
              echo "::warning::nuclei install failed or did not verify"
            fi
          else
            echo "::warning::could not resolve a nuclei release asset"
          fi

          # Nuclei ships no templates and the scan passes -duc (disable update
          # check) on purpose, so it will never fetch them itself — "Could not
          # run nuclei: no templates provided for scan". Fetching them here
          # keeps the deliberate-pin intent while giving the scan something to
          # run.
          nuclei -update-templates -silent 2>&1 | tail -2 || echo "::warning::nuclei template fetch failed"

          echo "--- installed ---"
          syft version        2>/dev/null | head -2 || echo "syft: MISSING"
          grype version       2>/dev/null | head -2 || echo "grype: MISSING"
          trivy --version     2>/dev/null | head -1 || echo "trivy: MISSING"
          trufflehog --version 2>&1        | head -1 || echo "trufflehog: MISSING"
          osv-scanner --version 2>/dev/null | head -1 || echo "osv-scanner: MISSING"
          nuclei -version     2>&1         | head -2 || echo "nuclei: MISSING"

      # Grype's first run downloads its vulnerability database (~5 min per the
      # ScanAll target description). Cached across runs by date.
      - name: Cache Grype DB
        if: steps.creds.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/grype
          key: grype-db-${{ github.run_id }}
          restore-keys: grype-db-

      # Tests and coverage are NOT part of ScanAll, so before this step the
      # dogfood run posted neither — leaving the coverage gate permanently
      # Unknown and the test-failure gate with nothing to read. A failing test
      # is data for this product, not a reason to stop: continue-on-error, and
      # the failure gets ingested like any other finding.
      - name: Test and coverage
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        run: dotnet run --project build -- Coverage --configuration Release

      # SonarQube Cloud nightly (TFND-227). Scheduled and manual runs only: a push to main is already
      # analysed by ci.yml, and analysing the same commit twice just doubles the history. Best-effort like
      # every scan here: a Sonar problem is data, not a reason to stop the ingest below.
      - uses: actions/setup-java@v4
        if: steps.creds.outputs.configured == 'true' && github.event_name != 'push'
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarCloud analysis (nightly)
        if: steps.creds.outputs.configured == 'true' && github.event_name != 'push'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TAMP_FINDINGS_TEST_DB: "Host=localhost;Port=5432;Database=tamp_findings_test;Username=tamp;Password=tamp"
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::notice::SONAR_TOKEN not configured - skipping SonarCloud."; exit 0; fi
          dotnet tool install --global dotnet-sonarscanner --version 10.4.1
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet run --project build -- Sonar --configuration Release

      - name: Static scans
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        run: dotnet run --project build -- ScanAll --configuration Release

      # ---- the dynamic half needs something running -----------------------

      - name: Build the image
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        run: dotnet run --project build -- DockerBuildImage --configuration Release

      - name: Start the app for dynamic scanning
        id: app
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          # Exactly the first 7 characters, matching Build.cs's
          # ImageTag => Git.Commit[..7]. `git rev-parse --short=7` returns the
          # shortest UNIQUE prefix of at least 7, which can be longer — and
          # then the tag would not be the one the build just created.
          SHA=$(git rev-parse HEAD | cut -c1-7)

          # --network host so the container reaches the Postgres service on
          # localhost and the runner reaches the app on localhost.
          docker run -d --name tamp-findings-dast --network host \
            -e TAMP_FINDINGS_DB="Host=localhost;Port=5432;Database=tamp_findings;Username=tamp;Password=tamp" \
            -e ASPNETCORE_URLS="http://0.0.0.0:5080" \
            "localhost:5000/tamp-findings:${SHA}" || {
              echo "::warning::could not start the app container — dynamic scans will be skipped"
              echo "up=false" >> "$GITHUB_OUTPUT"
              exit 0
            }

          # Wait on /ready, not /health. Liveness answers "the process is up"
          # without touching the database — scanning an instance that cannot
          # serve a request would produce a clean DAST result for an app that
          # is not working.
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5080/ready >/dev/null 2>&1; then
              echo "app ready after ${i}s"
              echo "up=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done

          echo "::warning::app did not become ready — dynamic scans will be skipped"
          docker logs tamp-findings-dast 2>&1 | tail -40
          echo "up=false" >> "$GITHUB_OUTPUT"

      # axe-core needs its Node tooling. Separate from the binary installs
      # because it is the only leg that wants a package manager.
      # axe-core needs its Node tooling AND a matched Chrome/ChromeDriver
      # pair. Separate from the binary installs because it is the only leg that
      # wants a package manager.
      - name: Install axe-core tooling
        if: steps.creds.outputs.configured == 'true' && steps.app.outputs.up == 'true'
        continue-on-error: true
        run: |
          # `set +e` and an explicit tolerate: pnpm exits 1 on
          # ERR_PNPM_IGNORED_BUILDS (it refuses chromedriver's postinstall),
          # and this step runs under `bash -e`. So the install "failing" killed
          # the step before browser-driver-manager could run at all — which is
          # why the driver kept disappearing. The ignored build is harmless
          # here precisely BECAUSE the driver comes from browser-driver-manager
          # below.
          corepack enable
          pnpm install --dir build/tools/node || echo "(pnpm reported ignored build scripts — expected)"

          # The chromedriver npm package pins a version (152) that will not
          # match whatever Chrome the runner happens to ship (151 today), and
          # ChromeDriver refuses to drive a different major: "session not
          # created: This version of ChromeDriver only supports Chrome version
          # 152". Pinning either side just moves the mismatch.
          #
          # browser-driver-manager installs a MATCHED pair and writes
          # ~/.browser-driver-manager/.env, which is where @axe-core/cli reads
          # CHROME_TEST_PATH and CHROMEDRIVER_TEST_PATH from — so this is the
          # mechanism the tool is built around rather than a workaround.
          # Pinned in build/tools/node/package.json and run from there (pnpm exec) rather than `npx -y`,
          # which would fetch whatever is newest at run time and run its lifecycle scripts (Sonar S6505).
          (cd build/tools/node && pnpm exec browser-driver-manager install chrome) || echo "::warning::browser-driver-manager failed — the accessibility scan will likely fail"

          # Prove it before a scan can claim to have run. "Installed the
          # package" and "can actually drive a browser" have been different
          # things at every attempt here.
          cat "$HOME/.browser-driver-manager/.env" 2>/dev/null || echo "::warning::no browser-driver-manager env written"

      # ZAP and Nuclei as SEPARATE steps, not the ScanDast aggregate. Nuke
      # aborts a target chain on the first failure, so when ZAP could not reach
      # the target on the first CI run it took Nuclei down with it — Nuclei runs
      # on the host and would have been fine. One scanner failing must not
      # silently remove another.
      - name: Dynamic scan (ZAP)
        if: steps.creds.outputs.configured == 'true' && steps.app.outputs.up == 'true'
        continue-on-error: true
        env:
          # 127.0.0.1 rather than localhost: nuclei does not always resolve
          # localhost, and its failure mode is a clean report for a target it
          # never reached. The target's own pre-flight check refuses that.
          TAMP_FINDINGS_DAST_TARGET_URL: http://127.0.0.1:5080
        run: |
          # ZAP runs as a non-root user INSIDE its container and writes the
          # report into the mounted artifacts directory, which is owned by the
          # runner user. Without this the scan completes — 38 URLs spidered —
          # and then dies on "AccessDeniedException /zap/wrk/zap.sarif.json",
          # which reads as a scan failure when the scan was fine.
          mkdir -p artifacts/security && chmod -R a+rwX artifacts/security
          dotnet run --project build -- SecurityScanZap --configuration Release

      - name: Dynamic scan (Nuclei)
        if: steps.creds.outputs.configured == 'true' && steps.app.outputs.up == 'true'
        continue-on-error: true
        env:
          TAMP_FINDINGS_DAST_TARGET_URL: http://127.0.0.1:5080
        run: dotnet run --project build -- SecurityScanNuclei --configuration Release

      - name: Accessibility scan (axe-core)
        if: steps.creds.outputs.configured == 'true' && steps.app.outputs.up == 'true'
        continue-on-error: true
        env:
          TAMP_FINDINGS_AXE_TARGET_URL: http://127.0.0.1:5080
        run: dotnet run --project build -- SecurityScanAxeCore --configuration Release

      # ---- and post the lot -----------------------------------------------

      # Static findings, SBOM, coverage, tests, receipts — and axe-core, which
      # rides here rather than with the DAST ingest because it describes the
      # browser surface ("web"), not the deployed target.
      - name: Ingest
        if: steps.creds.outputs.configured == 'true'
        env:
          TAMP_FINDINGS_URL: ${{ secrets.TAMP_FINDINGS_URL }}
          TAMP_FINDINGS_INGEST_TOKEN: ${{ secrets.TAMP_FINDINGS_INGEST_TOKEN }}
          CI_BUILD_ID: ${{ github.run_id }}
        run: dotnet run --project build -- Ingest --configuration Release

      # ZAP + Nuclei, under the "deployed" flavor. Its own target because the
      # full Ingest would file them against the wrong flavor.
      - name: Ingest dynamic findings
        if: steps.creds.outputs.configured == 'true' && steps.app.outputs.up == 'true'
        continue-on-error: true
        env:
          TAMP_FINDINGS_URL: ${{ secrets.TAMP_FINDINGS_URL }}
          TAMP_FINDINGS_INGEST_TOKEN: ${{ secrets.TAMP_FINDINGS_INGEST_TOKEN }}
          CI_BUILD_ID: ${{ github.run_id }}
        run: dotnet run --project build -- IngestDast --configuration Release

      # TFND-134. The base image behind the artefact, read remotely so a stale
      # local copy cannot answer with the wrong publish date.
      - name: Ingest container image metadata
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        env:
          TAMP_FINDINGS_URL: ${{ secrets.TAMP_FINDINGS_URL }}
          TAMP_FINDINGS_INGEST_TOKEN: ${{ secrets.TAMP_FINDINGS_INGEST_TOKEN }}
          CI_BUILD_ID: ${{ github.run_id }}
        run: dotnet run --project build -- InspectContainerImage --configuration Release

      # Pull this commit's SonarQube Cloud analysis back into findings (TFND-227): issues + hotspots as
      # SonarQube findings, the quality-gate verdict, and a scan-run receipt. On the nightly / dispatch run
      # the scan above has just analysed HEAD. On a push to main the ci.yml scan may not have finished, and
      # the target then skips cleanly ("SonarCloud has not analysed this commit yet") rather than ingesting
      # an older commit's results as the newest build.
      - name: Ingest SonarCloud results
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        env:
          TAMP_FINDINGS_URL: ${{ secrets.TAMP_FINDINGS_URL }}
          TAMP_FINDINGS_INGEST_TOKEN: ${{ secrets.TAMP_FINDINGS_INGEST_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet run --project build -- IngestSonar --configuration Release

      - name: App logs
        if: always() && steps.app.outputs.up == 'true'
        continue-on-error: true
        run: docker logs tamp-findings-dast 2>&1 | tail -60

      - name: Upload scan artifacts
        if: always() && steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          # Test results too: when a leg fails, the question is almost always
          # "what did the scanner actually emit", and artifacts/security alone
          # cannot answer it for the coverage and test legs.
          path: |
            artifacts/security/
            artifacts/test-results/
          if-no-files-found: warn
