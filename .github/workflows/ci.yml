name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run. main is exempt so
# every merged commit keeps a complete, attributable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real database for the integration suite. Those tests SKIP when
    # TAMP_FINDINGS_TEST_DB is unset, so a contributor without Docker still
    # gets a green `dotnet test` — but CI has one, and the query layer is
    # exactly what unit tests cannot see: a broken join or a wrong slug
    # comparison passes every contract-level assertion.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tamp_findings_test
          POSTGRES_USER: tamp
          POSTGRES_PASSWORD: tamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Pinned by global.json (10.0.202, rollForward latestFeature) so CI and
      # local builds cannot drift apart on SDK version.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tamp.Findings.slnx

      # Directory.Build.props already sets TreatWarningsAsErrors, so a new
      # warning fails the build here without any extra flag.
      - name: Build
        run: dotnet build Tamp.Findings.slnx -c Release --no-restore

      - name: Test
        env:
          # Turns the integration suite ON. Without it those tests skip, which
          # is the correct behaviour locally and the wrong one here.
          TAMP_FINDINGS_TEST_DB: "Host=localhost;Port=5432;Database=tamp_findings_test;Username=tamp;Password=tamp"
        run: >
          dotnet test Tamp.Findings.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --settings build/coverlet.runsettings
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test-results/
          if-no-files-found: warn

  spa:
    name: SPA build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # web/ is retired by TFND-128. Until then it still builds and ships, so CI
    # protects it. Delete this job with the directory, not before.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc -b && vite build`. Type errors MUST be caught by
      # `tsc -b` (project references) — `tsc --noEmit` is a silent no-op in this
      # repo's config and will pass over broken code.
      - name: Build
        working-directory: web
        run: pnpm build

      # Non-blocking on purpose. web/ currently has 14 eslint errors
      # (react-hooks/set-state-in-effect, no-unused-expressions) in code
      # TFND-128 deletes. Fixing them is work spent on something being
      # removed; losing the signal entirely is worse. Revisit only if this
      # count grows — new errors mean someone is still adding React.
      - name: Lint
        working-directory: web
        continue-on-error: true
        run: pnpm lint

      - name: Test
        working-directory: web
        run: pnpm test:coverage

      - name: Upload SPA coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-coverage
          path: artifacts/test-results-spa/
          if-no-files-found: warn
