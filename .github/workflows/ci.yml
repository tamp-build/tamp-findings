name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run. main is exempt so
# every merged commit keeps a complete, attributable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real database for the integration suite. Those tests SKIP when
    # TAMP_FINDINGS_TEST_DB is unset, so a contributor without Docker still
    # gets a green `dotnet test` — but CI has one, and the query layer is
    # exactly what unit tests cannot see: a broken join or a wrong slug
    # comparison passes every contract-level assertion.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tamp_findings_test
          POSTGRES_USER: tamp
          POSTGRES_PASSWORD: tamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Pinned by global.json (10.0.202, rollForward latestFeature) so CI and
      # local builds cannot drift apart on SDK version.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tamp.Findings.slnx

      # Directory.Build.props already sets TreatWarningsAsErrors, so a new
      # warning fails the build here without any extra flag.
      - name: Build
        run: dotnet build Tamp.Findings.slnx -c Release --no-restore

      - name: Test
        env:
          # Turns the integration suite ON. Without it those tests skip, which
          # is the correct behaviour locally and the wrong one here.
          TAMP_FINDINGS_TEST_DB: "Host=localhost;Port=5432;Database=tamp_findings_test;Username=tamp;Password=tamp"
        run: >
          dotnet test Tamp.Findings.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --settings build/coverlet.runsettings
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test-results/
          if-no-files-found: warn

  # SonarQube Cloud analysis (TFND-227): every push to main and every pull request. A separate job so a
  # Sonar or network hiccup never reds the build/test job, and so the two run in parallel. It builds and
  # tests again under the scanner (Begin -> build -> test with coverage -> End) because the scanner has to
  # observe the build. A fork PR has no secrets, so the scan is skipped there rather than failing.
  # Automatic Analysis is disabled on the SonarCloud project; it conflicts with a CI-driven scan.
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tamp_findings_test
          POSTGRES_USER: tamp
          POSTGRES_PASSWORD: tamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check credentials
        id: creds
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN not available (fork PR?) - skipping the SonarCloud analysis."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          # Full history so SonarCloud can attribute new code and blame.
          fetch-depth: 0

      # The SonarScanner for .NET runs on the JVM (SonarQube Cloud recommends 21).
      - uses: actions/setup-java@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.creds.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install SonarScanner for .NET
        if: steps.creds.outputs.configured == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 10.4.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Dogfood: the tamp build drives the scan (SonarBegin -> Compile -> Test -> SonarEnd).
      - name: SonarCloud scan
        if: steps.creds.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Same as the test job: turns the integration suite on so its coverage is counted.
          TAMP_FINDINGS_TEST_DB: "Host=localhost;Port=5432;Database=tamp_findings_test;Username=tamp;Password=tamp"
        run: dotnet run --project build -- Sonar --configuration Release

  # The container image. Separate job because it shares nothing with the test
  # job — different toolchain, no database — and running it in parallel keeps
  # the wall clock at whichever is slower rather than their sum.
  #
  # This exists because `dotnet test` does NOT catch a broken image build. A
  # ProjectReference added to the API without a matching COPY in the Dockerfile
  # restores fine on the solution and fails only at `dotnet publish
  # --no-restore` inside the image — which nothing here reached until now. That
  # shipped once (TFND-12 added Tamp.Findings.Mcp and the Dockerfile was not
  # updated), and the first symptom was a deploy failing days later.
  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          # Never pushed from CI — the image registry is not reachable from CI,
          # and the point of this job is that the build SUCCEEDS, not that the
          # artefact goes anywhere.
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
