# tamp.findings — dev convenience compose.
#
# Brings up only the bits a contributor doesn't run locally: Postgres.
# The app runs from `dotnet run` — one process serving both the UI and the
# API since TFND-128 retired the separate SPA dev server — so debuggers
# and hot-reload stay snappy. Production adopters point the API at their
# own Postgres via a connection string (TFND-4 / F3.2).

services:
  postgres:
    image: postgres:17-alpine
    container_name: tamp-findings-postgres
    environment:
      POSTGRES_DB: tamp_findings
      POSTGRES_USER: tamp
      POSTGRES_PASSWORD: tamp
      # Locale + encoding so JSONB and full-text search behave predictably.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # Host port deliberately offset from the Postgres default to avoid
      # collisions with other local Postgres containers; the container still
      # listens on 5432 internally.
      - "5544:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamp -d tamp_findings"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
